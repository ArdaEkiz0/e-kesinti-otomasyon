name: Zip Paket Derle ve Release Olustur

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: ZIP paketi olustur (kaynak dosyalar - antivirüs sorunu yok)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path paket | Out-Null
          Copy-Item sgk_bot.py paket/
          Copy-Item BAT_BASLAT.bat paket/
          Copy-Item BAT_KURULUM.bat paket/
          Copy-Item BENI_OKU.txt paket/
          Copy-Item docs/app_logo.ico paket/
          Compress-Archive -Path paket/* -DestinationPath SGK_E_Kesinti_Otomasyon.zip -Force
          Get-Item SGK_E_Kesinti_Otomasyon.zip | Select-Object Name, Length

      - name: Release olustur ve zip'i yukle
        uses: softprops/action-gh-release@v2
        with:
          files: SGK_E_Kesinti_Otomasyon.zip
          generate_release_notes: true
