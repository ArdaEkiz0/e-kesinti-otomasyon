<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Sayfa Bulunamadı | SGK E-Kesinti Otomasyonu</title>
<link rel="icon" href="favicon.png">
<style>
:root{--arka:#0b1220;--metin:#e6edf7;--soluk:#94a3b8;--yesil:#22c55e;--turkuaz:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--arka);color:var(--metin);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.kutu{max-width:480px}
.logo{width:88px;height:88px;border-radius:20px;margin-bottom:20px}
.emoji{font-size:64px;display:inline-block;animation:zipla 2s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
h1{font-size:80px;font-weight:800;background:linear-gradient(90deg,var(--yesil),var(--turkuaz));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
p{color:var(--soluk);font-size:16px;margin:10px 0 28px}
.butonlar a{display:inline-block;margin:6px;padding:12px 26px;border-radius:12px;text-decoration:none;font-weight:700;font-size:15px;transition:.2s}
.geri{background:var(--yesil);color:#052e16}
.eve{border:1px solid #2a3a5c;color:var(--soluk)}
.geri:hover,.eve:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="kutu">
  <span class="emoji">🌾</span>
  <h1>404</h1>
  <p>Bu sayfa tarlada kaybolmuş görünüyor.<br>Endişelenme — bot hâlâ çalışıyor!</p>
  <div class="butonlar">
    <a class="geri" href="https://ardaekiz0.github.io/e-kesinti-otomasyon/">🏠 Ana Sayfaya Dön</a>
    <a class="eve" href="https://github.com/ArdaEkiz0/e-kesinti-otomasyon">⬇ Programı İndir</a>
  </div>
</div>
<script>document.querySelector('.eve').href='https://github.com/ArdaEkiz0/e-kesinti-otomasyon/releases/latest/download/SGK_E_Kesinti_Otomasyon.zip';</script>
</body>
</html>
