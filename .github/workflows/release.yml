name: Exe Derle ve Release Olustur

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller kur
        run: pip install pyinstaller pillow

      - name: Ikon olustur
        run: python -c "from PIL import Image; img = Image.open('docs/icon-512.png'); img.save('app_icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: KURULUM.exe derle (sgk_bot.py gömülü, ikon + sürüm bilgisi)
        run: pyinstaller --onefile --console --clean --name KURULUM --add-data "sgk_bot.py;." --icon app_icon.ico --version-file version.txt KURULUM.py

      - name: Release olustur ve exe'yi yukle
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KURULUM.exe
          generate_release_notes: true
